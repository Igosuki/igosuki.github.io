[project]
name = "graph-context"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["networkx>=3.3", "fastembed>=0.4"]

[project.scripts]
graphctx = "graphctx:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graphctx", "context"]
