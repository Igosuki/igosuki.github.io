name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        run: |
          curl -fsS https://www.gepsens.com/sitemap-0.xml \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's#<loc>##' -e 's#</loc>##' \
            | jq -R . | jq -s \
              '{host: "www.gepsens.com", key: "1a51d33dcb8d9641c850cdda7946aaac", keyLocation: "https://www.gepsens.com/1a51d33dcb8d9641c850cdda7946aaac.txt", urlList: .}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @-
